# Aperture 服务商配置模板
# 本文件提供了所有支持的服务商的配置模板，方便用户快速配置

# ===========================================
# 如何使用此模板
# ===========================================
# 1. 复制需要的服务商配置到 providers.yaml
# 2. 将 ${API_KEY} 替换为实际的 API Key
# 3. 或设置环境变量（推荐）

# ===========================================
# OpenAI 兼容服务商配置模板
# ===========================================

# OpenRouter - 多模型聚合平台
openrouter_template:
  provider_id: "openrouter"
  provider_name: "OpenRouter"
  base_url: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"  # 从 https://openrouter.ai/keys 获取
  supported_protocols: ["openai"]
  pricing_tier: "free"
  features: ["streaming", "function_calling", "vision"]
  rate_limits:
    rpm: 200
    tpm: 40000
  free_limits:
    daily_requests: 100
    monthly_requests: 1000
  # OpenRouter 特殊配置
  custom_headers:
    HTTP-Referer: "https://your-app.com"  # 替换为你的应用URL
    X-Title: "Your App Name"              # 替换为你的应用名称
  enabled: true

# Groq - 超低延迟推理
groq_template:
  provider_id: "groq"
  provider_name: "Groq"
  base_url: "https://api.groq.com/openai/v1"
  api_key: "${GROQ_API_KEY}"  # 从 https://console.groq.com/keys 获取
  supported_protocols: ["openai"]
  pricing_tier: "free"
  features: ["streaming", "audio_transcription"]
  rate_limits:
    rpm: 30
    tpm: 15000
  free_limits:
    daily_requests: 100
    monthly_requests: 1000
  enabled: true


# 阿里云百炼（OpenAI兼容）
aliyun_bailian_template:
  provider_id: "aliyun_bailian"
  provider_name: "阿里云百炼"
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key: "${ALIYUN_API_KEY}"  # 从阿里云控制台获取

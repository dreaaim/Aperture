# ===========================================
# 自定义服务商配置模板
# ===========================================

# 使用此模板添加任何 OpenAI 兼容的服务商
custom_openai_compatible_template:
  provider_id: "custom_provider"
  provider_name: "Custom Provider"
  base_url: "https://api.custom-provider.com/v1"  # 替换为实际URL
  api_key: "${CUSTOM_API_KEY}"
  supported_protocols: ["openai"]
  pricing_tier: "free"  # 或 "paid"
  features: ["streaming"]  # 根据实际情况调整
  rate_limits:
    rpm: 60
    tpm: 40000
  # 可选：模型名称映射
  model_mapping:
    "gpt-4": "custom-model-name"
  # 可选：额外参数
  extra_params:
    key: "value"
  # 可选：自定义headers
  custom_headers:
    X-Custom-Header: "value"
  enabled: true

# ===========================================
# 环境变量配置示例
# ===========================================
# 创建 .env 文件并添加以下内容：
#
# # 免费服务商
# OPENROUTER_API_KEY=sk-or-xxx
# GROQ_API_KEY=gsk_xxx
# CEREBRAS_API_KEY=xxx
# NVIDIA_API_KEY=nvapi-xxx
# MISTRAL_API_KEY=xxx
# GITHUB_TOKEN=ghp_xxx
#
# # 付费服务商
# OPENAI_API_KEY=sk-xxx
# ANTHROPIC_API_KEY=sk-ant-xxx
# FIREWORKS_API_KEY=xxx
#
# # 国内服务商
# MODELSCOPE_API_KEY=xxx
# ALIYUN_API_KEY=sk-xxx

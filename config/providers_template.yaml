  provider_id: "modelscope"
  provider_name: "ModelScope"
  base_url: "https://api-inference.modelscope.cn/v1"
  api_key: "${MODELSCOPE_API_KEY}"  # 从 https://modelscope.cn 获取
  supported_protocols: ["modelscope"]

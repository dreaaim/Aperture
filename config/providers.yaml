free_providers:
  # OpenRouter - 多模型聚合平台（推荐）
  openrouter:
    provider_id: "openrouter"
    provider_name: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key: "${OPENROUTER_API_KEY}"
    supported_protocols: ["openai"]
    pricing_tier: "free"
    features: ["streaming", "function_calling", "vision"]
    rate_limits:
      rpm: 200
      tpm: 40000
    free_limits:
      daily_requests: 100
      monthly_requests: 1000
    custom_headers:
      HTTP-Referer: "https://aperture.ai"
      X-Title: "Aperture AI Gateway"
    models:
      - id: "openrouter/auto"
        name: "Auto (Best)"
        description: "自动选择最佳模型"
      - id: "meta-llama/llama-3.1-8b-instruct:free"
        name: "Llama 3.1 8B"
        description: "Meta Llama 3.1 8B 免费版"
      - id: "google/gemma-2-9b-it:free"

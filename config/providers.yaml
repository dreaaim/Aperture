      - id: "qwen-plus"
        name: "Qwen Plus"
        description: "通义千问增强版"
      - id: "qwen-max"
        name: "Qwen Max"
        description: "通义千问旗舰版"
      - id: "qwen-vl-max"
        name: "Qwen VL Max"
        description: "视觉语言模型"
    enabled: false

# ===========================================
# 自定义部署服务商（需要额外配置）
# ===========================================
custom_providers:
  # Baseten - 自定义模型部署
  baseten:
    provider_id: "baseten"
    provider_name: "Baseten"
    base_url: "https://app.baseten.co/models/${BASETEN_MODEL_ID}/predict"
    api_key: "${BASETEN_API_KEY}"
    supported_protocols: ["custom"]
    pricing_tier: "paid"
    features: ["custom_models"]
    free_limits:
      trial_credits: 30
    note: "需要部署自己的模型"
    enabled: false

  # Modal - 自定义模型部署
  modal:
    provider_id: "modal"
    provider_name: "Modal"
    base_url: "custom"
    api_key: "${MODAL_TOKEN_ID}:${MODAL_TOKEN_SECRET}"
    supported_protocols: ["custom"]
    pricing_tier: "paid"
    features: ["custom_models", "gpu"]
    free_limits:
      monthly_credits: 5
      with_payment: 30
    note: "需要部署自己的模型"
    enabled: false

  # NLP Cloud
  nlp_cloud:
    provider_id: "nlp_cloud"
    provider_name: "NLP Cloud"
    base_url: "https://api.nlpcloud.io/v1/gpu"
    api_key: "${NLP_CLOUD_API_KEY}"
    supported_protocols: ["custom"]
    pricing_tier: "paid"
    features: ["streaming"]
    free_limits:
      trial_credits: 15
    models:
      - id: "llama-3-70b"
        name: "Llama 3 70B"
        description: "NLP Cloud托管"
      - id: "dolphin"
        name: "Dolphin"
        description: "NLP Cloud托管"
    note: "使用自定义API格式"
    enabled: false

# ===========================================
# 全局配置
# ===========================================
global_settings:
  default_provider: "openrouter"
  fallback_order:
    - "openrouter"
    - "groq"
    - "cerebras"
    - "mistral"
    - "github_models"
    - "google_ai_studio"
  
  timeout: 60
  max_retries: 3
  retry_delay: 1.0
  
  load_balancing:
    strategy: "round_robin"
    health_check_interval: 300
  
  cost_optimization:
    prefer_free: true
    max_cost_per_request: 0.1
    
  monitoring:
    enabled: true
    log_level: "INFO"
    metrics_interval: 60

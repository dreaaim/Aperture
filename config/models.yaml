  gpt-4o:
    model_id: "gpt-4o"
    model_name: "GPT-4 Omni"
    model_type: "llm"
    capabilities:
      - "reasoning"
      - "code"
      - "vision"
      - "function_calling"
      - "json_mode"
    context_window: 128000
    max_output_tokens: 4096
